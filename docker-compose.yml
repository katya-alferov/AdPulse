# =====================================================================
# AdPulse - local, free, real-time AdTech analytics platform
#   docker compose up -d --build        start everything
#   docker compose ps                   see status / health
#   docker compose logs -f spark-streaming
#   docker compose down                 stop (data volumes are kept)
#   docker compose down -v              stop AND delete all data
# =====================================================================

name: adpulse

x-app-common: &app-common
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: adpulse-app:1.0.0
  env_file: .env
  networks: [adpulse-net]
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- Kafka
  kafka:
    image: apache/kafka:3.9.1
    container_name: adpulse-kafka
    hostname: kafka
    ports:
      - "9094:9094"   # for tools running on your computer (localhost:9094)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft mode: no ZooKeeper needed
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # topics are created explicitly by kafka-init
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [adpulse-net]
    restart: unless-stopped

  kafka-init:
    <<: *app-common
    container_name: adpulse-kafka-init
    command: ["python", "-m", "adpulse.kafka_io.admin"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16.15-alpine
    container_name: adpulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adpulse}
      POSTGRES_USER: ${POSTGRES_USER:-adpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro   # schema + seed run on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [adpulse-net]
    restart: unless-stopped

  # ---------------------------------------------------------------- S3-compatible storage
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    container_name: adpulse-seaweedfs
    hostname: seaweedfs
    ports:
      - "8333:8333"   # S3 API
    entrypoint: ["/bin/sh", "/opt/adpulse/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs-entrypoint.sh:/opt/adpulse/seaweedfs-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [adpulse-net]
    restart: unless-stopped

  storage-init:
    <<: *app-common
    container_name: adpulse-storage-init
    command: ["python", "-m", "adpulse.storage.object_store"]
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy

  # ---------------------------------------------------------------- Python services
  generator:
    <<: *app-common
    container_name: adpulse-generator
    command: ["python", "-m", "adpulse.generator"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  auditor:
    <<: *app-common
    container_name: adpulse-auditor
    command: ["python", "-m", "adpulse.kafka_io.consumer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- Spark
  spark-streaming:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: adpulse-spark:1.0.0
    container_name: adpulse-spark-streaming
    env_file: .env
    command: ["/opt/spark/bin/spark-submit", "--master", "local[*]", "--driver-memory", "2g", "/opt/adpulse/spark_jobs/streaming_job.py"]
    ports:
      - "4040:4040"   # Spark UI
    volumes:
      - spark-checkpoints:/opt/adpulse/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [adpulse-net]
    restart: unless-stopped

  spark-batch:
    image: adpulse-spark:1.0.0
    container_name: adpulse-spark-batch
    profiles: ["batch"]        # only runs when asked: docker compose run --rm spark-batch
    env_file: .env
    command: ["/opt/spark/bin/spark-submit", "--master", "local[*]", "/opt/adpulse/spark_jobs/batch_report_job.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [adpulse-net]
    restart: "no"

  # ---------------------------------------------------------------- API + dashboard
  api:
    <<: *app-common
    container_name: adpulse-api
    command: ["uvicorn", "adpulse.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    <<: *app-common
    container_name: adpulse-dashboard
    command: ["streamlit", "run", "src/adpulse/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

networks:
  adpulse-net:
    name: adpulse-net

volumes:
  kafka-data:
  postgres-data:
  seaweedfs-data:
  spark-checkpoints:
